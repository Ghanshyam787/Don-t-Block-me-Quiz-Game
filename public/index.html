const extra=mood==='sad'?`<path d="M30 42l12 4M70 42l-12 4" stroke="${ink}" stroke-width="2.6" stroke-linecap="round"/><path class="tear" d="M67 60q-5 8 0 11q5-3 0-11z" fill="#6cc4ff" stroke="#3a9be0" stroke-width="1.2"/>`:mood==='happy'?`<text x="8" y="26" font-size="13">✨</text><text x="80" y="22" font-size="13">💖</text>`:'';
return `<span class="c3"><svg class="chr" width="${s}" height="${s*1.1}" viewBox="0 0 100 110" aria-hidden="true"><defs><radialGradient id="gb" cx=".35" cy=".3" r=".85"><stop offset="0" stop-color="#f7cfae"/><stop offset="1" stop-color="#c98458"/></radialGradient><radialGradient id="gp" cx=".35" cy=".3" r=".85"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#cfdcec"/></radialGradient></defs>
<ellipse class="arm al" cx="21" cy="90" rx="8" ry="14" fill="${g}" stroke="${o}" stroke-width="3"/><ellipse class="arm ar" cx="79" cy="90" rx="8" ry="14" fill="${g}" stroke="${o}" stroke-width="3"/>
<ellipse cx="50" cy="95" rx="27" ry="17" fill="${g}" stroke="${o}" stroke-width="3"/><ellipse cx="50" cy="98" rx="14" ry="9" fill="#fff" opacity=".45"/>
<circle cx="22" cy="24" r="14" fill="${ear}" stroke="${o}" stroke-width="3"/><circle cx="78" cy="24" r="14" fill="${ear}" stroke="${o}" stroke-width="3"/><circle cx="22" cy="24" r="6" fill="#ffb7a8" opacity=".75"/><circle cx="78" cy="24" r="6" fill="#ffb7a8" opacity=".75"/>
<circle cx="50" cy="55" r="38" fill="${g}" stroke="${o}" stroke-width="3"/><ellipse cx="36" cy="33" rx="12" ry="6" fill="#fff" opacity=".4" transform="rotate(-25 36 33)"/>
<ellipse cx="30" cy="64" rx="8" ry="6" fill="${ch}" opacity=".8"/><ellipse cx="70" cy="64" rx="8" ry="6" fill="${ch}" opacity=".8"/>
${eye(38)}${eye(62)}<ellipse cx="50" cy="58" rx="3.6" ry="2.6" fill="${ink}"/>${mouth}${extra}</svg></span>`};
const show=h=>{app.innerHTML=h;window.scrollTo(0,0)};
const go=p=>{history.pushState(0,'',p);route()};
const toast=m=>{const e=$('toast');e.textContent=m;e.style.display='block';clearTimeout(toast.h);toast.h=setTimeout(()=>e.style.display='none',2800)};
const fail=e=>{show(`<div class="card"><h2>😿 Oops</h2><p class="err" style="text-align:center">${esc(e.message)}</p><button class="primary" onclick="go('/')">${t('makeOwn')}</button></div>`)};
const bar=()=>`<div class="top"><button class="bk" id="bk" aria-label="${t('back')}">‹</button><div class="duo">${face('bear',44)}${face('panda',44)}</div><span style="width:46px"></span></div>`;
const wave=s=>s.split(' ').map((w,i)=>`<span style="--i:${i}">${esc(w)}</span>`).join(' ');
const still=()=>matchMedia('(prefers-reduced-motion:reduce)').matches;
const burst=(list,n,x,y)=>{if(still())return;for(let i=0;i<n;i++){const s=document.createElement('span');s.textContent=list[i%list.length];s.style.fontSize=16+Math.random()*18+'px';
  if(x==null){s.className='cf';s.style.left=Math.random()*100+'vw';s.style.animationDelay=Math.random()*1.2+'s'}else{s.className='fh';s.style.left=x+(Math.random()-.5)*70+'px';s.style.top=y+(Math.random()-.5)*30+'px'}
  document.body.appendChild(s);setTimeout(()=>s.remove(),4500)}};
addEventListener('pointermove',e=>{const r=document.documentElement.style;r.setProperty('--ex',((e.clientX/innerWidth-.5)*2).toFixed(2));r.setProperty('--ey',((e.clientY/innerHeight-.5)*2).toFixed(2))});
document.addEventListener('click',e=>{const c=e.target.closest('.c3');if(c){c.classList.add('jl');setTimeout(()=>c.classList.remove('jl'),650);burst(['💖'],3,e.clientX,e.clientY)}});
const prog=(p,g)=>`<div class="barw"><div class="bar"><i style="width:${p}%"></i></div><span class="wk" style="left:calc(${p}% - 14px)">${face(g,30)}</span></div>`;
const optRow=(q,o,k,cls,mk)=>`<button class="opt ${cls}" data-k="${k}" disabled>${icon(q.ic&&q.ic[k],k)}<span class="tx">${esc(o)}</span><span class="mk">${mk}</span></button>`;

// Sawaal ek ek karke. check(q,k) ho (dost ka mode) to turant sahi/galat tick + mascot ka mood; jawab lock.
function runner(qs,onDone,check,g='male'){
  let i=0,busy=false;const ans={};
  const draw=()=>{
    const q=qs[i];busy=false;
    show(`${bar()}${prog(i/qs.length*100,g)}<p class="muted" style="text-align:center">${t('qn')} ${i+1}/${qs.length}</p>
    <div class="card q"><div class="ms" id="ms">${face(g,92)}</div><h2>${esc(q.text)}</h2>${q.options.map((o,k)=>`<button class="opt ${!check&&ans[q.id]===k?'sel':''}" data-k="${k}">${icon(q.ic&&q.ic[k],k)}<span class="tx">${esc(o)}</span><span class="mk"></span></button>`).join('')}
    <div id="nx"></div></div>`);
    $('bk').onclick=()=>{if(check)go('/');else if(i){i--;draw()}else history.back()};
    const ops=[...app.querySelectorAll('.opt')];
    ops.forEach(b=>b.onclick=async()=>{
      if(busy)return;busy=true;const k=+b.dataset.k;ans[q.id]=k;
      if(!check){b.classList.add('sel');return setTimeout(()=>{if(i<qs.length-1){i++;draw()}else onDone(ans)},220)}
      try{const right=await check(q,k);
        ops.forEach(o=>{o.classList.add('locked');o.disabled=true});
        const mk=(o,c,e)=>{o.classList.add(c);o.querySelector('.mk').textContent=e};
        const okk=k===right;if(okk){mk(b,'ok','✅');burst(['💖','✨','⭐'],10)}else{mk(b,'no','❌');mk(ops[right],'ok','✅')}
        $('ms').innerHTML=face(g,92,okk?'happy':'sad');if(!okk)$('ms').classList.add('no');
        $('nx').innerHTML=`<button class="primary" id="nb" style="margin-top:14px">${i<qs.length-1?t('next')+' ›':t('finish')+' 🎉'}</button>`;
        $('nb').onclick=()=>{if(i<qs.length-1){i++;draw()}else onDone(ans)};$('nb').focus();
      }catch(e){busy=false;toast(e.message)}});
  };draw();
}
const wiz=(pages,done)=>{let i=0;const d={};const run=()=>pages[i](d,()=>{if(++i<pages.length)run();else done(d)},()=>{if(i){i--;run()}else go('/')});run()};
const choice=(p,title,items,onPick)=>{
  show(`${bar()}<h1>${title}</h1><div class="grid">${items.map(i=>`<button class="opt pick" data-v="${i.v}"><span class="em">${i.e||''}</span>${esc(i.l)}</button>`).join('')}</div>`);
  $('bk').onclick=p;app.querySelectorAll('.pick').forEach(b=>b.onclick=()=>onPick(b.dataset.v))};
const P={
 name:(d,n,p)=>{show(`${bar()}<div class="card"><div class="duo">${face('bear',74)}${face('panda',74)}</div><h2>${t('yourName')}</h2><input id="v" maxlength="30" value="${esc(d.name||LS.get('name',''))}" placeholder="${t('namePh')}" autocomplete="off"><p class="err" id="e"></p><button class="primary" id="ok">${t('next')} ›</button></div>`);
  $('bk').onclick=p;const g=()=>{const v=$('v').value.trim();if(!v)return $('e').textContent=t('needName');d.name=v;LS.set('name',v);n()};$('ok').onclick=g;$('v').onkeydown=e=>{if(e.key==='Enter')g()}},
 gender:(d,n,p)=>{show(`${bar()}<p class="muted" style="text-align:center">hi, <b style="color:#e0a000">${esc(d.name)}</b> 👋</p><h1>${t('gender')}</h1><div class="grid g2"><button class="opt pick" data-v="male">${face('male',110)}<br>${t('male')}</button><button class="opt pick" data-v="female">${face('female',110)}<br>${t('female')}</button></div>`);
  $('bk').onclick=p;app.querySelectorAll('.pick').forEach(b=>b.onclick=()=>{d.gender=b.dataset.v;n()})},
 rel:(d,n,p)=>choice(p,t('rel'),Object.keys(T.en.rels).map(k=>({v:k,l:relL(k),e:RE[k]})),v=>{d.relation=v;n()}),
 qlang:(d,n,p)=>choice(p,t('qlang'),LANGS.map(([v,f,l])=>({v,l,e:f})),v=>{d.qlang=v;n()})
};

function home(){
  show(`<div class="hero"><span class="spk" style="left:2%;top:20px">✨</span><span class="spk" style="right:4%;top:6px;animation-delay:.8s">⭐</span><span class="spk" style="right:0;top:130px;animation-delay:1.4s">💖</span><span class="spk" style="left:0;top:140px;animation-delay:.4s">🌸</span>
  <div class="scene"><svg class="rb" viewBox="0 0 300 150" aria-hidden="true"><path d="M14 148a136 136 0 0 1 272 0" stroke="#ff9ab6" stroke-width="13" fill="none" stroke-linecap="round"/><path d="M32 148a118 118 0 0 1 236 0" stroke="#ffd84d" stroke-width="13" fill="none" stroke-linecap="round"/><path d="M50 148a100 100 0 0 1 200 0" stroke="#7be3b0" stroke-width="13" fill="none" stroke-linecap="round"/><path d="M68 148a82 82 0 0 1 164 0" stroke="#7cc4ff" stroke-width="13" fill="none" stroke-linecap="round"/></svg>
  <div class="duo">${face('bear',104)}${face('panda',104)}</div></div>
  <h1 class="sticker wave">${wave(t('title'))}</h1><div class="ribbon">${t('tag')}</div></div>
  <div class="clouds" style="margin-top:22px"><div></div></div>
  <div class="card"><div class="dash"><div style="font-size:54px;animation:bob 3s ease-in-out infinite">🧸💬</div><h2>${t('h1')}</h2><button class="primary" id="go">${t('create')} ›</button></div></div>
  <h2 style="margin-top:24px">${t('how')}</h2><div class="card">${[['✏️','h1'],['📤','h2'],['🏆','h3']].map(([e,k])=>`<div class="how"><span class="ico">${e}</span><div><b>${t(k)}</b><p class="muted">${t(k+'d')}</p></div></div>`).join('')}</div>`);
  $('go').onclick=()=>wiz([P.name,P.gender,P.qlang],async d=>{try{
    const r=await api('/quiz','POST',{name:d.name,gender:d.gender,lang:d.qlang});
    const mine=LS.get('mine',{});mine[r.id]={token:r.token,name:d.name};LS.set('mine',mine);
    S.lang=d.qlang;LS.set('S',S);go('/me/'+r.id)}catch(e){fail(e)}});
}

async function me(id,view){
  const tk=(LS.get('mine',{})[id]||{}).token;
  if(!tk)return fail(new Error(t('notHere')+' '+location.origin+'/q/'+id));
  try{
    const d=await api(`/quiz/${id}/me?token=${tk}`);
    S.lang=d.lang;dirFix();   // creator apni quiz-language mein hi dekhta/jawab deta hai
    if(!d.ready){const {questions}=await api('/base-questions?lang='+d.lang);
      return runner(questions,async a=>{try{await api(`/quiz/${id}/answers`,'POST',{token:tk,answers:a});me(id)}catch(e){fail(e)}},null,d.gender)}
    ({scores,addq}[view]||share)(id,tk,d);
  }catch(e){fail(e)}
}
const copy=s=>{const f=()=>{const i=$('l');if(i){i.select();try{document.execCommand('copy')}catch{}}};try{navigator.clipboard.writeText(s).catch(f)}catch{f()}};

function share(id,tk,d){
  const link=location.origin+'/q/'+id,e=encodeURIComponent,mob=/Android|iPhone|iPad/i.test(navigator.userAgent),txt=t('shareMsg');
  const B=[['instagram','📸','linear-gradient(45deg,#fdb750,#e1306c,#833ab4)','Instagram','https://www.instagram.com/direct/inbox/'],
   ['snapchat','👻','#fffc00','Snapchat','https://www.snapchat.com/scan?attachmentUrl='+e(link)],
   ['facebook','📘','#1877f2','Facebook','https://www.facebook.com/sharer/sharer.php?u='+e(link)],
   ['messenger','💬','linear-gradient(#00b2ff,#a334fa)','Messenger',mob?'fb-messenger://share/?link='+e(link):null],
   ['telegram','✈️','#2aabee','Telegram','https://t.me/share/url?url='+e(link)+'&text='+e(txt)],
   ['other','🔗','#e3efff',t('other'),null]];
  const A=h=>h?`href="${h}" ${h.startsWith('http')?'target="_blank" rel="noopener"':''}`:'href="#"';
  show(`${bar()}<div class="card" style="text-align:center"><span class="speech">${esc(d.name)} 💬</span><div class="duo">${face(d.gender==='female'?'panda':'bear',124)}</div>
  <h2 style="margin-top:0">${t('shareT')} 🎭</h2>
  <div class="linkbox">🔗<input id="l" readonly value="${link}" aria-label="link"><button id="cp">${t('copy')}</button></div>
  <a class="btn wa" id="wa" ${A('https://api.whatsapp.com/send?text='+e(txt+' '+link))}>💬 ${t('wa')}</a>
  <div class="sh">${B.map(b=>`<a data-s="${b[0]}" ${A(b[4])}><span class="c" style="background:${b[2]}">${b[1]}</span>${b[3]}</a>`).join('')}</div>
  <button class="primary" id="ck">🏆 ${t('check')} (${d.results.length})</button></div>
  <button class="opt" id="aq">➕ ${t('addQ')}</button><button class="opt" id="re">🔄 ${t('redo')}</button>`);
  $('bk').onclick=()=>go('/');
  $('cp').onclick=()=>{copy(link);toast(t('copied'))};
  app.querySelectorAll('.sh a').forEach(a=>a.onclick=ev=>{      // link pehle apne aap copy; phir app/website khulti hai
    const x=B.find(y=>y[0]===a.dataset.s);copy(link);toast(t('pasteMsg'));
    if(!x[4]){ev.preventDefault();if(navigator.share)navigator.share({title:t('title'),text:txt,url:link}).catch(()=>{})}});
  $('wa').onclick=()=>copy(link);
  $('ck').onclick=()=>me(id,'scores');$('aq').onclick=()=>me(id,'addq');
  $('re').onclick=async()=>{await api(`/quiz/${id}/reset`,'POST',{token:tk});me(id)};
}

// ---- Scores: pehle sirf naam-list. Naam dabao -> (try chuno) -> ek page par ek sawaal, pictures ke saath ----
function scores(id,tk,d){
  const G={};d.results.forEach(r=>(G[r.pid]=G[r.pid]||{r,list:[]}).list.push(r));
  const gs=Object.values(G),back=()=>scores(id,tk,d);
  show(`${bar()}<h1>🏆 ${t('check')}</h1><p class="muted" style="text-align:center">${gs.length} ${t('people')} · ${d.results.length} ${t('attempts')}</p>
  ${gs.length?gs.map((g,n)=>`<button class="person" data-n="${n}">${face(g.r.gender==='female'?'panda':'bear',44)}<span class="info"><b>${esc(g.r.player)}</b><small>${esc(relL(g.r.relation)||'')} · ${g.list.length} ${t('tries')}</small></span><span class="sc">${t('best')} ${Math.max(...g.list.map(x=>x.score))}/${g.r.total}</span></button>`).join(''):`<div class="card"><p class="muted" style="text-align:center">${t('noPlay')}</p></div>`}`);
  $('bk').onclick=()=>me(id);
  app.querySelectorAll('.person').forEach(b=>b.onclick=()=>{const g=gs[+b.dataset.n];g.list.length===1?review(d,g.list[0],back):tries(d,g,back)});
}
function tries(d,g,back){
  show(`${bar()}<h1>${esc(g.r.player)}</h1><p class="muted" style="text-align:center">${esc(relL(g.r.relation)||'')} · ${g.list.length} ${t('tries')}</p>
  ${g.list.map((r,n)=>`<button class="person" data-n="${n}"><span class="ico">🎯</span><span class="info"><b>${t('tryN')} ${g.list.length-n}</b><small>${new Date(r.at).toLocaleString()}</small></span><span class="sc">${r.score}/${r.total}</span></button>`).join('')}`);
  $('bk').onclick=back;app.querySelectorAll('.person').forEach(b=>b.onclick=()=>review(d,g.list[+b.dataset.n],()=>tries(d,g,back)));
}
function review(d,r,back){
  let i=0;const g=r.gender;
  const draw=()=>{const it=r.items[i],q=d.qs[it.id],ok=it.ok,last=i===r.items.length-1;
    show(`${bar()}${prog((i+1)/r.items.length*100,g)}<p class="muted" style="text-align:center">${esc(r.player)} · ${t('qn')} ${i+1}/${r.items.length} · <span class="sc">${r.score}/${r.total}</span></p>
    <div class="card q"><div class="ms ${ok?'':'no'}">${face(g,92,ok?'happy':'sad')}</div><h2>${esc(q.text)}</h2>
    ${q.options.map((o,k)=>optRow(q,o,k,k===it.chosen?(ok?'ok':'no'):(k===it.right?'ok':''),k===it.chosen?(ok?'✅':'❌'):(k===it.right?'✅':''))).join('')}
    <h2 style="margin:16px 0 0;color:${ok?'#16a34a':'#dc2626'}">${ok?t('correct'):t('wrong')}</h2></div>
    <div class="nav">${i?`<button id="pv">‹ ${t('prev')}</button>`:''}<button class="primary" id="nx">${last?t('done'):t('next')+' ›'}</button></div>`);
    $('bk').onclick=back;if(i)$('pv').onclick=()=>{i--;draw()};$('nx').onclick=()=>{if(last)back();else{i++;draw()}};
  };draw();
}

function addq(id,tk,d){
  let n=4;
  const opts=()=>$('co').innerHTML=Array.from({length:n},(_,k)=>`<div class="row"><input type="radio" name="ok" value="${k}" ${k===0?'checked':''} aria-label="${t('right')}"><input class="oi" maxlength="60" placeholder="${t('optPh')} ${k+1}"></div>`).join('');
  show(`${bar()}<div class="card"><h2>➕ ${t('addQ')}</h2><p class="muted">${t('addInfo')}</p>
  <textarea id="ct" rows="2" maxlength="150" placeholder="${t('qPh')}"></textarea><div id="co"></div>
  <button id="ao">${t('addOpt')}</button> <button class="primary" id="sv" style="margin-top:12px">${t('save')}</button><p class="err" id="e"></p></div>
  ${d.custom.map(c=>`<div class="card row" style="margin:8px 0 14px;padding:12px 18px"><span>${esc(c.text)}</span><button data-d="${c.id}">${t('del')}</button></div>`).join('')}`);
  opts();$('bk').onclick=()=>me(id);
  $('ao').onclick=()=>{if(n<6){const v=[...document.querySelectorAll('.oi')].map(i=>i.value),c=+document.querySelector('input[name=ok]:checked').value;n++;opts();document.querySelectorAll('.oi').forEach((i,k)=>i.value=v[k]||'');document.querySelectorAll('input[name=ok]')[c].checked=true}};
  $('sv').onclick=async()=>{try{
    const all=[...document.querySelectorAll('.oi')].map(i=>i.value.trim()),c=+document.querySelector('input[name=ok]:checked').value;
    if(!all[c])throw new Error(t('right')+' ?');
    const kept=all.map((o,k)=>[o,k]).filter(x=>x[0]);
    await api(`/quiz/${id}/custom`,'POST',{token:tk,text:$('ct').value,options:kept.map(x=>x[0]),answer:kept.findIndex(x=>x[1]===c)});me(id,'addq');
  }catch(er){$('e').textContent=er.message}};
  app.querySelectorAll('[data-d]').forEach(b=>b.onclick=async()=>{await api(`/quiz/${id}/custom/${b.dataset.d}?token=${tk}`,'DELETE');me(id,'addq')});
}

// Dost: language nahi chun sakta - quiz banane wale ki language mein hi sab kuch dikhta hai
async function play(id){
  try{
    const q=await api('/quiz/'+id);S.lang=q.lang;dirFix();
    if(!q.ready)return fail(new Error(t('notReady')));
    let pid=LS.get('pid',null);if(!pid){pid=Math.random().toString(36).slice(2)+Date.now().toString(36);LS.set('pid',pid)}
    wiz([P.name,P.gender,P.rel],d=>begin(id,pid,d,q));
  }catch(e){fail(e)}
}
async function begin(id,pid,d,q){
  try{
    const r=await api(`/quiz/${id}/start`,'POST',{pid,player:d.name,gender:d.gender,relation:d.relation});
    runner(r.questions,async()=>{try{
      const s=await api(`/attempt/${r.attempt}/submit`,'POST',{});
      const m=s.score>=8?t('great'):s.score>=5?t('good'):t('low');
      show(`${bar()}<div class="card" style="text-align:center"><div class="duo">${face(q.gender==='female'?'panda':'bear',116,s.score>=5?'happy':'')}</div><h2>${esc(q.name)} 💞</h2><p class="muted">${t('yourScore')}</p><p class="big">${s.score}/${s.total}</p><h2>${m}</h2>
      <button class="primary" id="ag">🔄 ${t('again')}</button><button class="opt" style="margin-top:16px;text-align:center" onclick="go('/')">🧸 ${t('makeOwn')}</button></div>`);
      $('bk').onclick=()=>go('/');$('ag').onclick=()=>begin(id,pid,d,q);if(s.score>=5)burst(['🎉','✨','💖','⭐','🎈'],24);
    }catch(e){fail(e)}},(qq,k)=>api(`/attempt/${r.attempt}/answer`,'POST',{qid:qq.id,choice:k}).then(x=>x.right),q.gender);
  }catch(e){fail(e)}
}
function route(){S=LS.get('S',{lang:'en'});dirFix();const p=location.pathname.split('/');if(p[1]==='me')me(p[2]);else if(p[1]==='q')play(p[2]);else home()}
window.onpopstate=route;route();
</script></body></html>
